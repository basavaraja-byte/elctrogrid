services:
  db:
    image: postgres:16-alpine
    container_name: dispatchgrid_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dispatchgrid
      POSTGRES_PASSWORD: dispatchgrid_secret
      POSTGRES_DB: dispatchgrid
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatchgrid -d dispatchgrid"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: dispatchgrid_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://dispatchgrid:dispatchgrid_secret@db:5432/dispatchgrid
      ALLOW_OVERNIGHT_SHIFTS: "false"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed.seed_data &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:

